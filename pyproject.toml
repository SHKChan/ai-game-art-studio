[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-game-art-studio"
version = "0.5.0"
description = "Local-first 2D game art studio: own pixel engine (Atelier-compatible), ComfyUI generation, import, animation editing and game-engine export."
requires-python = ">=3.10"
dependencies = ["Pillow>=10.0,<13", "numpy>=1.24,<3"]
license = {text = "MIT"}

[project.scripts]
artstudio = "artstudio.cli:main"

[tool.setuptools.packages.find]
include = ["artstudio*"]

[tool.setuptools.package-data]
artstudio = ["web/*", "schema/*.json"]
