<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Game Art Studio</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo">◆</span> AI Game Art Studio</div>
  <label class="proj">Project
    <select id="projectSelect" aria-label="Project"></select>
  </label>
  <button id="newProjectBtn" class="ghost">+ Project</button>
  <div class="spacer"></div>
  <div id="providerPills" class="pills" aria-label="Provider status"></div>
  <select id="langSelect" aria-label="Language" data-no-i18n></select>
  <select id="themeSelect" aria-label="Theme" title="Theme"></select>
</header>
<nav class="tabs" role="tablist">
  <button data-tab="home" class="active">Home</button>
  <button data-tab="wizard">Motion Studio</button>
  <button data-tab="forge">Pixel Forge</button>
  <button data-tab="import">Asset Import</button>
  <button data-tab="library">Library</button>
  <button data-tab="export">Export</button>
  <span class="sep"></span>
  <button id="moreBtn" class="more" aria-expanded="false" title="Advanced tools">More tools ▸</button>
  <button data-tab="animation" class="adv">Animation editor</button>
  <button data-tab="character" class="adv">Character details</button>
  <button data-tab="generate" class="adv">Generation &amp; workflows</button>
  <button data-tab="procedural" class="adv">Pixel documents</button>
</nav>
<main>
  <section id="tab-home" class="tab active"></section>
  <section id="tab-wizard" class="tab"></section>
  <section id="tab-forge" class="tab"></section>
  <section id="tab-library" class="tab"></section>
  <section id="tab-character" class="tab"></section>
  <section id="tab-animation" class="tab"></section>
  <section id="tab-procedural" class="tab"></section>
  <section id="tab-import" class="tab"></section>
  <section id="tab-generate" class="tab"></section>
  <section id="tab-export" class="tab"></section>
</main>
<aside id="jobsDock" class="dock collapsed">
  <div class="dock-head"><b>Jobs</b> <span id="jobsCount" class="muted small" data-no-i18n></span><button id="jobsToggle" class="ghost small">▾</button></div>
  <div id="jobsList"></div>
</aside>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="/static/app.js"></script>
</body>
</html>
